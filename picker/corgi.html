<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corgdoku — Pick the Corgi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../vendor/fonts.css">
<style>
  :root{
    --bg-top:#F3FBF8; --bg-bottom:#E3F5EE; --surface:#FFFFFF;
    --ink:#1F3B36; --ink-muted:#5E7B75; --accent:#FF6F61; --frame:#12332C;
    --shadow:0 1px 2px rgba(30,20,10,.16), 0 4px 10px rgba(30,20,10,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; padding:1.5rem 1rem 4rem;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    color:var(--ink); font-family:'Nunito',system-ui,sans-serif;
  }
  .page{ max-width:560px; margin:0 auto; }
  h1{ font-family:'Quicksand',sans-serif; font-weight:700; text-align:center; font-size:1.7rem; margin:0 0 .2rem; }
  .sub{ text-align:center; color:var(--ink-muted); font-weight:700; font-size:.85rem; margin:0 0 1.4rem; line-height:1.5; }
  .card{
    background:var(--surface); border:3px solid transparent; border-radius:18px;
    padding:1rem .9rem .8rem; box-shadow:var(--shadow); cursor:pointer; margin-bottom:.9rem;
  }
  .card.sel{ border-color:var(--accent); }
  .row{ display:flex; align-items:center; gap:1rem; }
  .big{ width:104px; height:104px; flex:none; display:block; }
  .sizes{ display:flex; align-items:center; gap:.55rem; flex-wrap:wrap; }
  .tile{
    border-radius:4px; display:flex; align-items:center; justify-content:center;
    border:2px solid var(--frame); flex:none;
  }
  .tile .badge{
    width:64%; height:64%; border-radius:50%; background:rgba(255,255,255,.92);
    display:flex; align-items:center; justify-content:center;
  }
  .tile .badge svg{ width:82%; height:82%; display:block; }
  .t-lg{ width:62px; height:62px; }
  .t-md{ width:46px; height:46px; }
  .t-sm{ width:30px; height:30px; }
  .caption{ font-size:.68rem; color:var(--ink-muted); font-weight:700; text-align:center; margin-top:.15rem; }
  .name{ font-weight:800; font-size:.9rem; margin-top:.6rem; }
  .name .num{ color:var(--accent); }
  .note{ font-size:.75rem; color:var(--ink-muted); font-weight:700; margin-top:.15rem; }
  .summary{
    position:sticky; bottom:0; margin-top:1.5rem;
    background:var(--frame); color:#fff; border-radius:14px; padding:.85rem 1rem;
    font-weight:800; font-size:.9rem; text-align:center;
  }
  .summary span{ color:#FFD166; }
</style>
</head>
<body>
<div class="page">
  <h1>Pick the corgi</h1>
  <p class="sub">Same art style as your reference — bold outline, orange and white,
  pink ears — but drawn as a face, which survives being 28px on a big board.
  These differ in expression and framing, not style.</p>
  <div id="grid"></div>
  <div class="summary" id="summary">Pick: <span>–</span></div>
</div>

<script>
var C = { o:'#F0A04B', d:'#4A2B16', w:'#FFFFFF', p:'#F7A8C4', t:'#F5859F' };

function ears(sw){
  return `
    <path d="M24,50 Q12,22 20,3 Q36,5 47,32 Z" fill="${C.o}" stroke="${C.d}" stroke-width="${sw}" stroke-linejoin="round"/>
    <path d="M76,50 Q88,22 80,3 Q64,5 53,32 Z" fill="${C.o}" stroke="${C.d}" stroke-width="${sw}" stroke-linejoin="round"/>
    <path d="M29,42 Q21,25 25,13 Q35,18 43,34 Z" fill="${C.p}"/>
    <path d="M71,42 Q79,25 75,13 Q65,18 57,34 Z" fill="${C.p}"/>`;
}
function headShape(sw){
  return `
    <ellipse cx="50" cy="56" rx="33" ry="30" fill="${C.o}" stroke="${C.d}" stroke-width="${sw}"/>
    <path d="M50,28 Q41,38 41,50 Q24,53 22,64 Q26,79 50,79 Q74,79 78,64 Q76,53 59,50 Q59,38 50,28 Z" fill="${C.w}"/>
    <ellipse cx="50" cy="56" rx="33" ry="30" fill="none" stroke="${C.d}" stroke-width="${sw}"/>`;
}
function eyesOpen(){
  return `
    <ellipse cx="36" cy="50" rx="5" ry="5.6" fill="${C.d}"/>
    <ellipse cx="64" cy="50" rx="5" ry="5.6" fill="${C.d}"/>
    <ellipse cx="37.6" cy="48" rx="1.7" ry="1.9" fill="#fff"/>
    <ellipse cx="65.6" cy="48" rx="1.7" ry="1.9" fill="#fff"/>`;
}
function nose(){
  return `<ellipse cx="50" cy="62" rx="7" ry="5.4" fill="${C.d}"/>`;
}
function smile(){
  return `<path d="M50,67 Q50,74 41,73 M50,67 Q50,74 59,73"
      stroke="${C.d}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
}
function tongue(){
  return `<path d="M43,71 Q50,84 57,71 Z" fill="${C.t}" stroke="${C.d}" stroke-width="2.4" stroke-linejoin="round"/>`;
}
function cheeks(){
  return `
    <ellipse cx="27" cy="63" rx="6.5" ry="4.4" fill="${C.p}" opacity=".75"/>
    <ellipse cx="73" cy="63" rx="6.5" ry="4.4" fill="${C.p}" opacity=".75"/>`;
}

var CORGIS = [
  { name:'Happy, tongue out', note:'The reference expression — open smile, tongue showing.', svg:
    ears(5) + headShape(5) + eyesOpen() + nose() + tongue() + smile() },

  { name:'Calm smile', note:'Same face, mouth closed. Tidier, a bit more grown-up.', svg:
    ears(5) + headShape(5) + eyesOpen() + nose() + smile() },

  { name:'Winking', note:'One eye shut, tongue out — the cheekiest of the set.', svg:
    ears(5) + headShape(5) +
    `<path d="M31,50 Q36,45 41,50" stroke="${C.d}" stroke-width="3.6" fill="none" stroke-linecap="round"/>
     <ellipse cx="64" cy="50" rx="5" ry="5.6" fill="${C.d}"/>
     <ellipse cx="65.6" cy="48" rx="1.7" ry="1.9" fill="#fff"/>` +
    nose() + tongue() + smile() },

  { name:'Rosy cheeks', note:'Tongue out plus blush — the softest, most storybook.', svg:
    ears(5) + headShape(5) + cheeks() + eyesOpen() + nose() + tongue() + smile() },

  { name:'Bold &amp; chunky', note:'Thicker outline, bigger features — clearest at 12×12.', svg:
    ears(7) +
    `<ellipse cx="50" cy="56" rx="33" ry="30" fill="${C.o}" stroke="${C.d}" stroke-width="7"/>
     <path d="M50,28 Q40,38 40,50 Q23,54 21,65 Q26,80 50,80 Q74,80 79,65 Q77,54 60,50 Q60,38 50,28 Z" fill="${C.w}"/>
     <ellipse cx="50" cy="56" rx="33" ry="30" fill="none" stroke="${C.d}" stroke-width="7"/>
     <ellipse cx="35" cy="50" rx="5.8" ry="6.4" fill="${C.d}"/>
     <ellipse cx="65" cy="50" rx="5.8" ry="6.4" fill="${C.d}"/>
     <ellipse cx="36.8" cy="47.8" rx="2" ry="2.2" fill="#fff"/>
     <ellipse cx="66.8" cy="47.8" rx="2" ry="2.2" fill="#fff"/>
     <ellipse cx="50" cy="63" rx="8" ry="6" fill="${C.d}"/>
     <path d="M42,72 Q50,86 58,72 Z" fill="${C.t}" stroke="${C.d}" stroke-width="2.8" stroke-linejoin="round"/>
     <path d="M50,68.5 Q50,76 40,75 M50,68.5 Q50,76 60,75" stroke="${C.d}" stroke-width="3.6" fill="none" stroke-linecap="round"/>` },

  { name:'Head tilt', note:'Whole head cocked to one side — the most characterful.', svg:
    `<g transform="rotate(-9 50 56)">` +
      ears(5) + headShape(5) + eyesOpen() + nose() + tongue() + smile() +
    `</g>` }
];

var TILES = ['#3ECCA8','#A58EEB','#EBA58E'];
var pick = null;
var grid = document.getElementById('grid');

CORGIS.forEach(function(item, i){
  var card = document.createElement('div');
  card.className = 'card';
  var svg = '<svg viewBox="0 0 100 100">'+item.svg+'</svg>';
  card.innerHTML =
    '<div class="row">' +
      '<svg class="big" viewBox="0 0 100 100">'+item.svg+'</svg>' +
      '<div class="sizes">' +
        '<div><div class="tile t-lg" style="background:'+TILES[0]+'"><div class="badge">'+svg+'</div></div><div class="caption">5×5</div></div>' +
        '<div><div class="tile t-md" style="background:'+TILES[1]+'"><div class="badge">'+svg+'</div></div><div class="caption">8×8</div></div>' +
        '<div><div class="tile t-sm" style="background:'+TILES[2]+'"><div class="badge">'+svg+'</div></div><div class="caption">12×12</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="name"><span class="num">'+(i+1)+'.</span> '+item.name+'</div>' +
    '<div class="note">'+item.note+'</div>';
  card.addEventListener('click', function(){
    pick = i+1;
    Array.prototype.forEach.call(grid.children, function(c){ c.classList.remove('sel'); });
    card.classList.add('sel');
    document.getElementById('summary').innerHTML = 'Pick: <span>'+pick+'. '+item.name+'</span>';
  });
  grid.appendChild(card);
});
</script>
</body>
</html>
